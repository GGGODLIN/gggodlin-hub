name: Deploy site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Check public contract
        run: |
          node --test
          node scripts/check-public-contract.mjs public
      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Verify production release
        shell: bash
        run: |
          set -euo pipefail
          homepage="$RUNNER_TEMP/gggodlin-home.html"
          page="$RUNNER_TEMP/gggodlin-route.txt"
          status=$(curl -fsSL -o "$homepage" -w '%{http_code}' https://gggodlin.com/)
          test "$status" = 200
          grep -Fq 'data-site-release="pr-review-cloud-v1"' "$homepage"
          for pair in "/privacy:<h1>Privacy Policy</h1>" "/terms:<h1>Terms of Service</h1>" "/refund:<h1>Refund Policy</h1>" "/robots.txt:Allow: /"; do
            path="${pair%%:*}"
            marker="${pair#*:}"
            status=$(curl -fsSL -o "$page" -w '%{http_code}' "https://gggodlin.com$path")
            test "$status" = 200
            grep -Fq "$marker" "$page"
          done
          status=$(curl -fsSI -o /dev/null -w '%{http_code}' https://gggodlin.com/codex-ambassador.mp4)
          test "$status" = 200
          labs_home="$RUNNER_TEMP/labs-home.html"
          status=$(curl -fsSL --retry 8 --retry-delay 5 --retry-all-errors -o "$labs_home" -w '%{http_code}' https://labs.gggodlin.com/)
          test "$status" = 200
          grep -Fq 'data-site-release="pr-review-cloud-v1"' "$labs_home"
